- id: llm-deepseek
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-flash

# The template resolves through the credential store, which the headless profile disables.
- id: credentials
  disabled: false

- insert:
    - id: mcp-domain
      name: '@deepseek-ai/dsh-mcp-client/domain'
      config: { enabled: true }
